; Firmware de E/S para rst_servo_vivo.m: el ESP32 lee el BNO055 y saca el pulso del servo.
; El control (estimador + RST) lo calcula MATLAB.
;
; Cargar: abrir esta carpeta en VS Code con PlatformIO y pulsar Upload,
; o en la terminal:  pio run -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_deps =
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BNO055 @ ^1.6.3
    SPI
